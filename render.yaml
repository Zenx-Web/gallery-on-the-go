services:
  - type: web
    name: gallery-on-the-go-backend
    env: node
    buildCommand: npm install && npm run build:shared && npm run build:server
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # CORS — allow both the Vercel frontend and any local dev origin.
      # Update this whenever the frontend domain changes.
      - key: CORS_ORIGIN
        value: https://gallery-on-the-go-web.vercel.app
      # Secrets — must be set manually in the Render dashboard:
      # - key: SUPABASE_URL
      # - key: SUPABASE_ANON_KEY
      # - key: SUPABASE_SERVICE_ROLE_KEY
      # - key: JWT_SECRET
      # - key: ADMIN_EMAIL
      # - key: ADMIN_PASSWORD
      # - key: FIREBASE_SERVICE_ACCOUNT
