name: gallery_on_the_go
description: GalleryOnTheGo — reads phone media/downloads and streams them to the GalleryOnTheGo backend on demand.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Realtime transport — matches the server's Socket.IO v4 protocol (server/src/modules/relay/relay.gateway.ts)
  socket_io_client: ^2.0.3

  # MediaStore-backed gallery access (albums, photos, videos) with Android 13+ granular permissions
  photo_manager: ^3.2.4

  # Runtime permission requests (media + "all files access" for Downloads)
  permission_handler: ^11.3.1

  # Downloads folder path resolution
  path_provider: ^2.1.4

  # Device name/model/Android version for registration
  device_info_plus: ^10.1.2

  # Persist device token + server URL across restarts
  shared_preferences: ^2.3.2

  # Device registration REST call
  http: ^1.2.2

  # Thumbnail resize/compression to match FILE_CONSTANTS.THUMBNAIL_* on the server
  flutter_image_compress: ^2.3.0

  # Detect network changes to force a reconnect
  connectivity_plus: ^6.0.5

  # Unique id generation for device-name suffix
  uuid: ^4.5.1

  # Background isolate anchored to a foreground service — socket lives here
  flutter_background_service: ^5.0.5

  # Firebase Cloud Messaging — remote reconnect signal from web panel
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  cupertino_icons: ^1.0.8
  photo_manager_image_provider: ^2.2.0

  # Video playback in the fullscreen media viewer
  video_player: ^2.9.2

  # Typography for the gallery redesign
  google_fonts: ^6.2.1

  # Pinch-zoom + swipe-between-photos fullscreen viewer
  photo_view: ^0.15.0

  # Crop/rotate/brightness-contrast for the remote "Edit" action
  image: ^4.3.0

  # Native Android share sheet for the fullscreen media viewer
  share_plus: ^10.1.3

  # Real camera capture for the document scanner
  camera: ^0.11.0

  # Pick PDFs/images from device storage into the library
  file_picker: ^10.3.10

  # Local scheduled notifications for study/task/exam reminders
  flutter_local_notifications: ^18.0.1

  # IANA timezone database for scheduling exact local-time notifications
  timezone: ^0.9.4

  # Pure-Dart PDF generation for real "Save as PDF" scanner output
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates all mipmap launcher icon densities from a single source PNG —
  # run `dart run flutter_launcher_icons` after placing the logo at the path below.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo.png"
  # Adaptive icon: white backdrop matches the logo's own white canvas.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo.png"
